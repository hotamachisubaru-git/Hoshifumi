name: Windows build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Verify all seven chapters
        run: dotnet run -c Release -- --verify
      - name: Publish Windows x64
        run: dotnet publish -c Release -r win-x64 --self-contained true -o out/win-x64
      - name: Check Windows executable
        shell: pwsh
        run: |
          $game = Start-Process ./out/win-x64/Hoshifumi.exe -ArgumentList '--verify' -Wait -PassThru
          if ($game.ExitCode -ne 0) { throw "Campaign verification exited with $($game.ExitCode)." }
      - name: Check the Japanese window caption and both icons
        shell: pwsh
        env:
          ALSOFT_DRIVERS: 'null'
        run: |
          # Provide a software OpenGL driver on the GPU-less Windows runner for this test only.
          python -m pip download --disable-pip-version-check --no-deps --only-binary=:all: --dest "$env:RUNNER_TEMP" PyQt5-Qt5==5.15.2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $wheel = Get-ChildItem "$env:RUNNER_TEMP/PyQt5_Qt5-5.15.2-*-win_amd64.whl"
          $driver = Join-Path $env:RUNNER_TEMP opengl32sw.dll
          $archive = [IO.Compression.ZipFile]::OpenRead($wheel.FullName)
          try {
            [IO.Compression.ZipFileExtensions]::ExtractToFile($archive.GetEntry('PyQt5/Qt5/bin/opengl32sw.dll'), $driver, $true)
          } finally { $archive.Dispose() }
          if ((Get-FileHash $driver).Hash -ne '963641a718f9cae2705d5299eae9b7444e84e72ab3bef96a691510dd05fa1da4') { throw 'Unexpected software renderer' }
          $env:SDL_OPENGL_LIBRARY = $driver
          ./Tools/Test-Window.ps1 ./out/win-x64/Hoshifumi.exe
      - uses: actions/upload-artifact@v4
        with:
          name: Hoshifumi-win-x64
          path: out/win-x64/
          if-no-files-found: error
